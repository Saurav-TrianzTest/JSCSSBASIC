<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    GCP Cloud Storage + Cloud CDN Asset Pipeline (SRI enforcement)
    ---------------------------------------------------------------
    All external CSS assets are hosted on GCP Cloud Storage behind Cloud CDN.
    SRI hashes are computed in Cloud Build pipelines and injected at deploy time.
    Replace REPLACE_WITH_GCP_ASSETS_BUCKET with your actual GCP Cloud Storage bucket name.
    Replace REPLACE_WITH_SRI_HASH_* placeholders with hashes generated by Cloud Build:
      shasum -b -a 384 <file> | awk '{ print $1 }' | xxd -r -p | base64

    CLOUD READINESS FIX (cr-css-1002): Critical CSS Inlined for Above-Fold Content
    ---------------------------------------------------------------------------------
    Previously, critical above-fold CSS was loaded via @import in site.css, causing
    render-blocking requests that delayed First Contentful Paint (FCP).

    Remediation (Inline Critical CSS via Cloud CDN and Cloud Run Edge Middleware):
      - Critical above-fold CSS rules are now INLINED in the <style> block below.
      - The render-blocking @import statements have been removed from site.css.
      - Non-critical CSS is loaded via <link> tags with GCP Cloud Storage URLs + SRI.
      - Cloud Run Edge Middleware (middleware/inlineCriticalCss.js) dynamically injects
        this inlined critical CSS block into HTML responses at the edge for runtime use.
      - Cloud CDN serves all remaining CSS assets from GCP Cloud Storage with optimal
        cache headers, eliminating render-blocking external CSS for above-fold content.

    CLOUD READINESS FIX (cr-css-1006): Multiple CSS Files Not Concatenated or HTTP/2
    ----------------------------------------------------------------------------------
    Previously, loader.css used 13 individual @import statements (chunk00–chunk09,
    deferred.css, site.css, brand.css) creating excessive HTTP requests that degrade
    cloud CDN edge network performance.

    Remediation (GCP Cloud Storage + Cloud CDN with Webpack CSS Bundling via Cloud Build):
      - All CSS chunk files, deferred.css, site.css, and brand.css are now concatenated
        into a single bundle (dist/css/bundle.css) by webpack (webpack.config.js) via
        the `npm run build:bundle` script.
      - GCP Cloud Build runs `npm run build:bundle` and uploads dist/css/bundle.css to
        GCP Cloud Storage (gs://${_GCP_ASSETS_BUCKET}/css/bundle.css).
      - The single bundled CSS file is served via Cloud CDN with HTTP/2, eliminating
        all per-chunk HTTP request overhead.
      - The individual <link> tags for site.css and brand.css have been replaced with
        a single <link> tag pointing to the GCP Cloud Storage bundled CSS URL.
      - The local assets/css/loader.css file is no longer loaded in production.
        It is retained as a development-only reference only.

    CLOUD READINESS FIX (cr-css-1008): Client-Only CSS Loaded After Hydration
    ---------------------------------------------------------------------------
    Previously, styles in client-hydration.css (and Emotion-managed component styles)
    were only available after client-side JavaScript hydration, causing FOUC on
    Google Cloud Run SSR deployments.

    Remediation (Critical CSS SSR Injection on Google Cloud Run with Next.js):
      - Emotion's `createCache` / `extractCriticalToChunks` /
        `constructStyleTagsFromChunks` are configured in src/ui/styles.js with
        cache key 'app-ssr' so all component styles are collected during the
        server-side render pass.
      - The Cloud Run SSR middleware (middleware/inlineCriticalCss.js) injects the
        Emotion <style data-emotion="app-ssr"> tags into the HTML <head> BEFORE the
        response is sent to the client, ensuring styles are present before hydration.
      - The {{EMOTION_STYLE_TAGS}} placeholder below is replaced at SSR render time
        by the middleware with the actual Emotion-extracted <style> tags.
      - client-hydration.css is now imported unconditionally (no typeof window guard)
        in src/ui/styles.js so it is included in the SSR style extraction pass.
      - The STATIC_CRITICAL_CSS in middleware/inlineCriticalCss.js now includes the
        .hydrated-widget and .ssr-hidden rules so they are always present in the
        server-rendered HTML even without Emotion extraction.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://storage.googleapis.com; script-src 'self' 'nonce-{{CSP_NONCE}}'">
  <title>App</title>
  <!--
    CRITICAL ABOVE-FOLD CSS — INLINED (cr-css-1002 fix)
    -------------------------------------------------------
    These styles cover all above-the-fold content and are inlined here to achieve
    zero render-blocking requests for initial paint. Previously loaded via @import
    in site.css (https://cdn.example.net/critical-above-fold.css), now inlined
    directly for optimal First Contentful Paint (FCP) on GCP Cloud Run + Cloud CDN.

    Cloud Run Edge Middleware (middleware/inlineCriticalCss.js) also injects this
    block dynamically into HTML responses before serving through Cloud CDN.
  -->
  <style data-critical="true">
    /* === Critical above-the-fold CSS — inlined for zero render-blocking FCP === */

    /* Base reset / layout */
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.5; color: #0a2540; }
    img, svg { display: block; max-width: 100%; }

    /* Navigation — above fold */
    .nav { height: 56px; display: flex; align-items: center; padding: 0 24px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .nav__logo { font-weight: 700; font-size: 1.125rem; color: #0a2540; text-decoration: none; }
    .nav__links { display: flex; gap: 24px; list-style: none; margin: 0; padding: 0; }
    .nav__links a { color: #374151; text-decoration: none; font-size: 0.9375rem; }
    .nav__links a:hover { color: #0a2540; }

    /* Hero section — above fold */
    .hero { min-height: 480px; display: flex; flex-direction: column; justify-content: center; padding: 64px 24px; background: #f8fafc; }
    .hero__title { font-size: clamp(1.75rem, 4vw, 3rem); font-weight: 800; color: #0a2540; margin: 0 0 16px; }
    .hero__subtitle { font-size: 1.125rem; color: #4b5563; margin: 0 0 32px; max-width: 560px; }
    .hero__cta { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: #0a2540; color: #fff; border-radius: 6px; font-weight: 600; text-decoration: none; font-size: 1rem; }
    .hero__cta:hover { background: #0d3060; }

    /* Loader / skeleton — above fold */
    .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 4px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Utility — above fold */
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* === Hydration styles — SSR-injected to prevent FOUC (cr-css-1008 fix) === */
    /* Previously loaded only after client-side JS hydration via typeof window  */
    /* guard; now inlined server-side so styles are present before hydration.    */
    .hydrated-widget { opacity: 1; transition: opacity 0.3s; background: url('https://cdn.example.net/client-only-bg.png'); }
    .ssr-hidden { display: block; color: var(--hydrated-color); }
  </style>
  <!--
    EMOTION SSR STYLE TAGS — injected by Cloud Run SSR middleware (cr-css-1008 fix)
    ---------------------------------------------------------------------------------
    The {{EMOTION_STYLE_TAGS}} placeholder is replaced at SSR render time by
    middleware/inlineCriticalCss.js with <style data-emotion="app-ssr"> tags
    extracted via Emotion's extractCriticalToChunks / constructStyleTagsFromChunks.
    This ensures all Emotion-managed component styles are present in the HTML
    <head> before client hydration, eliminating style mismatch and FOUC.

    In static/non-SSR builds this placeholder is left empty or removed by the
    build pipeline.
  -->
  {{EMOTION_STYLE_TAGS}}
  <!--
    normalize.css v8.0.1 — hosted on GCP Cloud Storage, served via Cloud CDN.
    SRI hash injected by Cloud Build pipeline from Secret Manager.
  -->
  <link rel="stylesheet"
        href="https://storage.googleapis.com/REPLACE_WITH_GCP_ASSETS_BUCKET/css/normalize.min.css"
        integrity="sha384-REPLACE_WITH_SRI_HASH_NORMALIZE"
        crossorigin="anonymous">
  <!--
    charts.css — hosted on GCP Cloud Storage, served via Cloud CDN.
    SRI hash injected by Cloud Build pipeline from Secret Manager.
  -->
  <link rel="stylesheet"
        href="https://storage.googleapis.com/REPLACE_WITH_GCP_ASSETS_BUCKET/css/charts.css"
        integrity="sha384-REPLACE_WITH_SRI_HASH_CHARTS"
        crossorigin="anonymous">
  <!--
    animate.css v4.1.1 — hosted on GCP Cloud Storage, served via Cloud CDN.
    Non-critical (animation styles) — loaded as external file, NOT render-blocking
    for above-fold content. SRI hash injected by Cloud Build pipeline.
    (Previously imported via @import in site.css — moved here for SRI enforcement.)
  -->
  <link rel="stylesheet"
        href="https://storage.googleapis.com/REPLACE_WITH_GCP_ASSETS_BUCKET/css/animate.min.css"
        integrity="sha384-Gu3KVV2H9d+yA4QDpVB7VcOyhJlAVrcXd0thEjr4KznfaFPLe0xQJyonVxONa4ZC"
        crossorigin="anonymous">
  <!--
    CLOUD READINESS FIX (cr-css-1006): Single Concatenated CSS Bundle
    -------------------------------------------------------------------
    Previously, site.css and brand.css were loaded as separate <link> tags, and
    loader.css used 13 @import statements to load chunk00–chunk09, deferred.css,
    site.css, and brand.css individually — creating 15+ separate HTTP requests.

    All CSS files are now concatenated into a single bundle by webpack
    (webpack.config.js, entry: src/css-entry.js) via `npm run build:bundle`.
    GCP Cloud Build uploads dist/css/bundle.css to Cloud Storage and serves it
    via Cloud CDN with HTTP/2, reducing CSS HTTP requests to a single connection.

    SRI hash injected by Cloud Build pipeline from Secret Manager.
    To regenerate after updating CSS:
      shasum -b -a 384 dist/css/bundle.css | awk '{ print $1 }' | xxd -r -p | base64
  -->
  <link rel="stylesheet"
        href="https://storage.googleapis.com/REPLACE_WITH_GCP_ASSETS_BUCKET/css/bundle.css"
        integrity="sha384-REPLACE_WITH_SRI_HASH_BUNDLE"
        crossorigin="anonymous">
</head>
<body>
  <script type="importmap" nonce="{{CSP_NONCE}}">
    { "imports": { "@emotion/styled": "./assets/js/emotion-styled-shim.js" } }
  </script>
  <script type="module" src="src/ui/styles.js"></script>
</body>
</html>
